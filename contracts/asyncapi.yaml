asyncapi: 2.6.0
info:
  title: Open Media & Entertainment — Reference Media Core Platform — Domain Events
  version: 1.0.0
  description: >
    CloudEvents 1.0 envelopes published by the platform's bounded contexts.
    Consumers MUST be idempotent and tolerate unknown fields. Ordering is
    guaranteed only per aggregate (the CloudEvent `subject`).
servers:
  production:
    url: kafka://broker.media.svc.cluster.local:9092
    protocol: kafka
    description: Kafka-backed Knative Broker in production; Knative Broker abstraction elsewhere.
channels:
  content.created:
    publish:
      operationId: on-content-created
      message: { $ref: '#/components/messages/Generic' }
  rights.created:
    publish:
      operationId: on-rights-created
      message: { $ref: '#/components/messages/Generic' }
  release.created:
    publish:
      operationId: on-release-created
      message: { $ref: '#/components/messages/Generic' }
  programming.created:
    publish:
      operationId: on-programming-created
      message: { $ref: '#/components/messages/Generic' }
  notification.created:
    publish:
      operationId: on-notification-created
      message: { $ref: '#/components/messages/Generic' }
  piracy.evaluated:
    publish:
      operationId: on-piracy-evaluated
      message: { $ref: '#/components/messages/Generic' }
  audience.evaluated:
    publish:
      operationId: on-audience-evaluated
      message: { $ref: '#/components/messages/Generic' }
components:
  messages:
    Generic: { payload: { $ref: '#/components/schemas/CloudEvent' } }
  schemas:
    CloudEvent:
      type: object
      required: [specversion, id, source, type, time]
      properties:
        specversion: { type: string, enum: ['1.0'] }
        id: { type: string, format: uuid }
        source: { type: string, example: '/open-media-entertainment/service' }
        type: { type: string, example: 'context.event' }
        subject: { type: string, description: Aggregate id (ordering key). }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, enum: [application/json] }
        data: { type: object }
